<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar fornecedores Web</title>
</head>
<body>
<h1>Listar Fornecedores</h1>

<form method="GET" th:action="@{/fornecedor/pesquisarFornecedor}">

    <label>Digite o CNPJ:</label><br>
    <input type="text" id="cnpj" name="cnpj" th:value="${param.cnpj}" maxlength="18" placeholder="00.000.000/0000-00" /><br>

    <button type="submit">Pesquisar</button>
    <a th:href="@{/fornecedor}">
        <button type="button">Limpar</button>
    </a>
    <br><br>

</form>

<form method="GET" th:action="@{/fornecedor/novoFornecedor}">
    <button type="submit">Novo fornecedor</button>
</form>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Razão Social</th>
        <th>Nome Fantasia</th>
        <th>CNPJ</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Endereço</th>
        <th>Remover</th>
        <th>Editar</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doc : ${fornecedores}">
        <td th:text="${doc.id}"></td>
        <td th:text="${doc.razaoSocial}"></td>
        <td th:text="${doc.nomeFantasia}"></td>
        <td th:text="${doc.cnpj}"></td>
        <td th:text="${doc.email}"></td>
        <td th:text="${doc.telefone}"></td>
        <td th:text="${doc.endereco}"></td>

        <td>
            <a th:href="@{/fornecedor/removerFornecedor(id=${doc.id})}"
               th:data-nome="${doc.razaoSocial}"
               onclick="return confirm('Deseja realmente excluir o fornecedor: ' + this.getAttribute('data-nome') + '?');">
                Remover
            </a>
        </td>

        <td><a th:href="@{/fornecedor/editarFornecedor(id=${doc.id})}">Editar</a></td>
    </tr>
    </tbody>
</table>
<br>
<p style="color:red; font-weight: bold;" th:if="${erro}" th:text="${erro}"></p>
<a th:href="@{/}"> Voltar </a>
</body>

<script>
    const inputCnpj = document.getElementById('cnpj');

    inputCnpj.addEventListener('input', (e) => {
        let valor = e.target.value.replace(/\D/g, '');

        if (valor.length > 14) {
            valor = valor.slice(0, 14);
        }

        valor = valor.replace(/^(\d{2})(\d)/, '$1.$2');
        valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
        valor = valor.replace(/\.(\d{3})(\d)/, '.$1/$2');
        valor = valor.replace(/(\d{4})(\d{1,2})$/, '$1-$2');

        e.target.value = valor;
    });
</script>
</html>
