<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Gerenciar fornecedores Web</title>
</head>
<body>
<h1>Editar Cadastro Fornecedor</h1>

<form method="POST" th:action="@{/fornecedor/editarCadastroFornecedor}" th:object="${fornecedorRequest}">

	<input type="hidden" th:field="*{id}" />

	<label>Razão Social: </label><br>
	<input type="text" th:field="*{razaoSocial}" placeholder="razão social"><br><br>

	<label>Nome Fantasia: </label><br>
	<input type="text" th:field="*{nomeFantasia}" placeholder="nome fantasia"><br><br>

	<label>CNPJ: </label><br>
	<input type="text" th:field="*{cnpj}" maxlength="18" placeholder="00.000.000/0000-00" /><br><br>

	<label>E-mail: </label><br>
	<input type="email" th:field="*{email}" placeholder="seu.nome@email.com" /><br><br>

	<label>Telefone: </label><br>
	<input type="text" th:field="*{telefone}" maxlength="15" placeholder="(00) 00000-0000"><br><br>

	<label>Endereço: </label><br>
	<input type="text" th:field="*{endereco}" placeholder="endereço"><br><br>

	<p style="color:red" th:if="${erro}" th:text="${erro}"></p>

	<input type="submit" value="Salvar Alterações" />
</form>
<br>
<a th:href="@{/fornecedor}"> Voltar </a>
</body>

<script>
	const inputCnpj = document.getElementById('cnpj');
	const inputTelefone = document.getElementById('telefone');
	const inputEmail = document.getElementById('email');

	inputCnpj.addEventListener('input', (e) => {
		let valor = e.target.value.replace(/\D/g, ''); // Remove tudo que não for número

		if (valor.length > 14) {
			valor = valor.slice(0, 14);
		}

		valor = valor.replace(/^(\d{2})(\d)/, '$1.$2');
		valor = valor.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
		valor = valor.replace(/\.(\d{3})(\d)/, '.$1/$2');
		valor = valor.replace(/(\d{4})(\d{1,2})$/, '$1-$2');

		e.target.value = valor;
	});
	inputTelefone.addEventListener('input', (e) => {
		let valor = e.target.value.replace(/\D/g, ''); // Remove o que não for número

		if (valor.length > 11) {
			valor = valor.slice(0, 11); // Limita a 11 dígitos
		}

		valor = valor.replace(/^(\d{2})(\d)/g, '($1) $2');

		if (valor.length <= 13) {
			valor = valor.replace(/(\d{4})(\d)/, '$1-$2');
		} else {
			valor = valor.replace(/(\d{5})(\d)/, '$1-$2');
		}

		e.target.value = valor;
	});
	inputEmail.addEventListener('input', (e) => {
		let valor = e.target.value;

		valor = valor.toLowerCase().replace(/\s/g, '');

		e.target.value = valor;
	});
</script>
</html>
